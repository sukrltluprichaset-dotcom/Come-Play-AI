<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ภาพรวม - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div id="admin-nav-container"></div>

    <div class="max-w-6xl mx-auto p-6">
        <h2 class="text-xl font-bold text-slate-800 mb-6">ภาพรวมระบบ</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-xs text-slate-500 font-bold mb-2">ผู้ใช้งานทั้งหมด</p>
                <p id="stat-users" class="text-3xl font-black text-indigo-600">-</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-xs text-slate-500 font-bold mb-2">ตัวละครทั้งหมด</p>
                <p id="stat-characters" class="text-3xl font-black text-emerald-600">-</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-xs text-slate-500 font-bold mb-2">ข้อความแชททั้งหมด</p>
                <p id="stat-chats" class="text-3xl font-black text-amber-500">-</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <p class="text-xs text-slate-500 font-bold mb-2">รายงานรอตรวจสอบ</p>
                <p id="stat-reports" class="text-3xl font-black text-red-500">-</p>
            </div>
        </div>
    </div>

    <script src="admin-shared.js"></script>
    <script>
        const user = requireAdminAuth();
        if (user) {
            renderAdminNav('dashboard', user.username);
            loadStats();
        }

        async function loadStats() {
            try {
                const s = await apiFetch('/api/admin/stats');
                document.getElementById('stat-users').innerText = s.total_users;
                document.getElementById('stat-characters').innerText = s.total_characters;
                document.getElementById('stat-chats').innerText = s.total_chats;
                document.getElementById('stat-reports').innerText = s.pending_reports;
            } catch (err) {
                adminAlert(err.message);
            }
        }
    </script>
</body>
</html>
