<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="cpaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="cpaGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="200" height="200" rx="44" fill="#0a0814"/>
  <rect x="0" y="0" width="200" height="200" rx="44" fill="url(#cpaGlow)"/>

  <!-- ตัวอักษร C (Come Play AI) ไล่สีนีออนฟ้า-ม่วง-ชมพู วาดเป็นวงแหวนเปิดช่องขวา -->
  <circle cx="100" cy="100" r="52" fill="none" stroke="url(#cpaGrad)" stroke-width="24"
          stroke-linecap="round" stroke-dasharray="270 326" stroke-dashoffset="-27" transform="rotate(0 100 100)"/>

  <!-- จุดประกายเล็กๆ แทนความเป็น AI ที่ปลายช่องเปิดของตัว C -->
  <circle cx="146" cy="72" r="9" fill="url(#cpaGrad)"/>
</svg>
