<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงาน - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <div id="admin-nav-container"></div>

    <div class="max-w-6xl mx-auto p-6">
        <h2 class="text-xl font-bold text-slate-800 mb-6">รายงานตัวละคร</h2>
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 text-slate-500 text-xs uppercase font-bold border-b border-slate-200">
                        <tr>
                            <th class="px-4 py-3">ตัวละครที่ถูกรายงาน</th>
                            <th class="px-4 py-3">ผู้รายงาน</th>
                            <th class="px-4 py-3">รายละเอียด</th>
                            <th class="px-4 py-3">สถานะ</th>
                            <th class="px-4 py-3">ข้อความตอบกลับ</th>
                            <th class="px-4 py-3 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="reports-table-body" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- popup ตอบกลับผู้รายงาน + ปิดเคส -->
    <div id="reply-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/70 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-lg w-full mx-4">
            <h3 class="font-bold text-lg text-slate-800 mb-1">ตอบกลับผู้รายงาน</h3>
            <p id="reply-modal-info" class="text-sm text-slate-500 mb-3"></p>
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm text-slate-600 mb-3 max-h-32 overflow-y-auto whitespace-pre-wrap" id="reply-modal-details"></div>
            <textarea id="reply-text" rows="4" maxlength="1000" placeholder="พิมพ์ข้อความตอบกลับถึงผู้ใช้ (ไม่บังคับ)..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 resize-none bg-slate-50 text-sm"></textarea>
            <div class="flex gap-2 mt-4">
                <button onclick="closeReplyModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-lg transition">ยกเลิก</button>
                <button onclick="submitReply('rejected')" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2.5 rounded-lg transition">ไม่ดำเนินการ</button>
                <button onclick="submitReply('resolved')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition">แก้ไขแล้ว</button>
            </div>
        </div>
    </div>

    <script src="admin-shared.js"></script>
    <script>
        const user = requireAdminAuth();
        let reportsCache = [];
        let replyingReportId = null;

        if (user) {
            renderAdminNav('reports', user.username);
            loadReports();
        }

        // กัน XSS: ข้อความจากผู้ใช้ต้องผ่านฟังก์ชันนี้ก่อนใส่ลง innerHTML
        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }

        async function loadReports() {
            try {
                const reports = await apiFetch('/api/admin/reports');
                reportsCache = reports;
                const tbody = document.getElementById('reports-table-body');
                if (reports.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="px-4 py-8 text-center text-slate-400">ไม่มีรายงานในระบบ</td></tr>';
                    return;
                }
                const statusBadge = { pending: 'bg-amber-100 text-amber-700', resolved: 'bg-emerald-100 text-emerald-700', rejected: 'bg-slate-100 text-slate-600' };
                tbody.innerHTML = reports.map(r => `
                    <tr class="hover:bg-slate-50">
                        <td class="px-4 py-3 font-bold text-slate-800">${esc(r.character_name)}</td>
                        <td class="px-4 py-3 text-slate-600">${esc(r.username)}</td>
                        <td class="px-4 py-3 text-slate-600 max-w-xs truncate" title="${esc(r.details)}">${esc(r.details)}</td>
                        <td class="px-4 py-3"><span class="px-2 py-1 rounded text-xs font-bold ${statusBadge[r.status] || 'bg-slate-100'}">${esc(r.status)}</span></td>
                        <td class="px-4 py-3 text-slate-600 max-w-xs truncate" title="${esc(r.admin_reply)}">${r.admin_reply ? esc(r.admin_reply) : '<span class="text-slate-300">-</span>'}</td>
                        <td class="px-4 py-3 text-center">
                            ${r.status === 'pending'
                                ? `<button onclick="openReplyModal(${Number(r.report_id)})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-bold text-xs px-3 py-1.5 rounded-lg transition"><i class="fa-solid fa-reply mr-1"></i>ตอบกลับ / ปิดเคส</button>`
                                : '<span class="text-slate-300 text-xs">-</span>'}
                        </td>
                    </tr>`).join('');
            } catch (err) {
                adminAlert(err.message);
            }
        }

        function openReplyModal(id) {
            const r = reportsCache.find(x => x.report_id === id);
            if (!r) return;
            replyingReportId = id;
            document.getElementById('reply-modal-info').innerText = `ตัวละคร: ${r.character_name}  |  ผู้รายงาน: ${r.username}`;
            document.getElementById('reply-modal-details').innerText = r.details;
            document.getElementById('reply-text').value = '';
            document.getElementById('reply-modal').classList.remove('hidden');
        }

        function closeReplyModal() {
            document.getElementById('reply-modal').classList.add('hidden');
            replyingReportId = null;
        }

        async function submitReply(status) {
            if (replyingReportId === null) return;
            const reply = document.getElementById('reply-text').value.trim();
            try {
                await apiFetch(`/api/admin/reports/${replyingReportId}`, { method: 'PUT', body: JSON.stringify({ status, reply }) });
                closeReplyModal();
                loadReports();
            } catch (err) {
                adminAlert(err.message);
            }
        }
    </script>
</body>
</html>
